plugins {
    id 'com.android.application'
}

android {
    namespace 'com.patch.tool'
    compileSdk 34

    defaultConfig {
        applicationId "com.patch.tool"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "impl"
    productFlavors {
        // 免 root 版：走 Shizuku (adb shell)，包名 com.patch.tool.shizuku
        shizuku {
            dimension "impl"
            applicationIdSuffix ".shizuku"
        }
        // root 版：走 su，包名 com.patch.tool
        root {
            dimension "impl"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    shizukuImplementation "dev.rikka.shizuku:api:13.1.5"
    shizukuImplementation "dev.rikka.shizuku:provider:13.1.5"
    shizukuImplementation "androidx.annotation:annotation:1.7.0"
}
